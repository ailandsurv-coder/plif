<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planșa de profil: cum se citește</title>
<link rel="stylesheet" href="../lib/anim.css">
<script src="../lib/anim-ui.js"></script><script src="../lib/teren.js"></script>
<style>
  #paper{position:absolute;left:24px;right:24px;top:92px;bottom:150px;background:#fdfdfb;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  #paper svg{width:100%;height:100%}
  #paper text{font-family:"Arial Narrow",Arial,sans-serif}
  .opts{flex-direction:row}
</style>
</head><body>
<div class="a-title">Planșele de profil — cum se construiesc și cum se citesc<small>Profil longitudinal cu „chitara" de date · profil transversal · calculul volumelor (metoda secțiunilor medii)</small></div>
<div class="opts"><button data-s="0" class="on">1 · Profil longitudinal</button><button data-s="1">2 · Profil transversal</button><button data-s="2">3 · Volume</button></div>
<div id="paper"><svg id="sv" viewBox="0 0 1600 760"></svg></div>
<script>
(function(){
  const {seg, lerp, ease} = AnimUI, T = window.TEREN, sv = document.getElementById('sv');
  // aceeași axă ca în animația de profile (canal de desecare spre râu)
  const AX = [[90, 20], [210, 95], [330, 150], [430, 200]];
  const S = []; let L = 0;
  for(let i=1;i<AX.length;i++){ const [x0,y0] = AX[i-1], [x1,y1] = AX[i], d = Math.hypot(x1-x0, y1-y0), n = Math.ceil(d/2);
    for(let k=(i === 1 ? 0 : 1);k<=n;k++){ const f = k/n; S.push({s:L + d*f, x:x0 + (x1-x0)*f, y:y0 + (y1-y0)*f, dx:(x1-x0)/d, dy:(y1-y0)/d}); } L += d; }
  S.forEach(p => p.z = T.ground(p.x, p.y));
  const ZD = []; S.forEach((p, i) => { const want = p.z - 1.2; ZD.push(i === 0 ? want : Math.min(ZD[i-1] - 0.001*(p.s - S[i-1].s), want)); });
  const at = s => { const i = Math.max(0, Math.min(S.length - 2, Math.floor(s/L*(S.length - 1)))); return {p:S[i], zd:ZD[i]}; };
  const ST = []; for(let s=0; s<L - 5; s+=50) ST.push(s); ST.push(L);
  const R = ST.map(s => { const {p, zd} = at(s); return {s, zt:p.z, zd, h:p.z - zd, p}; });
  const f2 = v => v.toFixed(2).replace('.', ','), f3 = v => v.toFixed(3).replace('.', ',');
  // ---------------- profilul longitudinal
  function longit(k){
    const x0 = 230, x1 = 1560, yT = 60, yB = 400, zlo = Math.floor(Math.min(...ZD) - 1), zhi = Math.ceil(Math.max(...S.map(p => p.z)) + 1);
    const X = s => x0 + s/L*(x1 - x0), Y = z => yB - (z - zlo)/(zhi - zlo)*(yB - yT);
    let h = `<text x="${x0}" y="36" font-size="22" font-weight="700" fill="#111">PROFIL LONGITUDINAL — canal de desecare CD-1 (exemplu didactic)</text>
      <text x="${x1}" y="36" font-size="15" fill="#444" text-anchor="end">Scara L 1:2000 · H 1:100 · Plan de referință ${zlo},00</text>`;
    for(let z=zlo; z<=zhi; z++) h += `<line x1="${x0-8}" y1="${Y(z)}" x2="${x0}" y2="${Y(z)}" stroke="#111"/><text x="${x0-12}" y="${Y(z)+5}" font-size="13" text-anchor="end" fill="#111">${z}</text>`;
    h += `<line x1="${x0}" y1="${yT}" x2="${x0}" y2="${yB}" stroke="#111"/><line x1="${x0}" y1="${yB}" x2="${x1}" y2="${yB}" stroke="#111"/>`;
    const kT = seg(k, 0, 0.25), kD = seg(k, 0.25, 0.45), kG = seg(k, 0.45, 1, x=>x);
    const m = Math.max(2, Math.floor(S.length*kT));
    h += `<path d="${S.slice(0, m).map((p,i) => (i?'L':'M') + X(p.s).toFixed(1) + ' ' + Y(p.z).toFixed(1)).join(' ')}" fill="none" stroke="#111" stroke-width="2"/>`;
    if(kD > 0){ const md = Math.max(2, Math.floor(S.length*kD)); h += `<path d="${S.slice(0, md).map((p,i) => (i?'L':'M') + X(p.s).toFixed(1) + ' ' + Y(ZD[i]).toFixed(1)).join(' ')}" fill="none" stroke="#d2141e" stroke-width="2.4"/>`;
      h += `<text x="${X(L*0.1)}" y="${Y(ZD[Math.floor(S.length*0.1)]) + 20}" font-size="14" fill="#d2141e">linia proiectată (fundul canalului)</text><text x="${X(L*0.1)}" y="${Y(S[Math.floor(S.length*0.1)].z) - 10}" font-size="14" fill="#111">linia terenului</text>`; }
    // chitara
    const rows = ['Cote teren', 'Cote proiect', 'Adâncimi de săpătură', 'Distanțe parțiale', 'Distanțe cumulate', 'Pante proiect (‰)'], rh = 46, gy = 440;
    rows.forEach((r, i) => h += `<rect x="20" y="${gy + i*rh}" width="${x1 - 20}" height="${rh}" fill="none" stroke="#111"/><text x="28" y="${gy + i*rh + 29}" font-size="15" fill="#111" font-weight="700">${r}</text>`);
    h += `<line x1="${x0}" y1="${gy}" x2="${x0}" y2="${gy + rows.length*rh}" stroke="#111"/>`;
    const nR = Math.floor(R.length*kG + 0.001);
    R.forEach((r, i) => { const x = X(r.s); if(i >= nR) return;
      h += `<line x1="${x}" y1="${Y(r.zt)}" x2="${x}" y2="${gy}" stroke="#666" stroke-dasharray="3 3"/>`;
      const vt = (val, row, col) => `<text x="${x + 4}" y="${gy + row*rh + rh - 8}" font-size="13" fill="${col || '#111'}" transform="rotate(-90 ${x + 4} ${gy + row*rh + rh - 8})">${val}</text>`;
      h += vt(f2(r.zt), 0) + vt(f2(r.zd), 1, '#d2141e') + vt(f2(r.h), 2);
      if(i > 0){ const xp = X(R[i-1].s), d = r.s - R[i-1].s, sl = (R[i-1].zd - r.zd)/d*1000;
        h += `<text x="${(xp + x)/2}" y="${gy + 3*rh + 29}" font-size="13" text-anchor="middle" fill="#111">${f2(d)}</text>`;
        h += `<line x1="${xp}" y1="${gy + 6*rh - 6}" x2="${x}" y2="${gy + 5*rh + 6}" stroke="#111"/><text x="${(xp + x)/2}" y="${gy + 5*rh + 28}" font-size="13" text-anchor="middle" fill="#d2141e">${sl.toFixed(1).replace('.', ',')}</text>`; }
      h += `<text x="${x + 4}" y="${gy + 4*rh + rh - 8}" font-size="13" fill="#111" transform="rotate(-90 ${x + 4} ${gy + 4*rh + rh - 8})">${f2(r.s)}</text>`; });
    return h;
  }
  // ---------------- profilul transversal (la km 0+150)
  const CS = R[3], b = 0.5, mm = 1.5;
  function transv(k){
    const pts = []; for(let d=-10; d<=10; d+=1) pts.push({d, z:T.ground(CS.p.x - CS.p.dy*d, CS.p.y + CS.p.dx*d)});
    const zt = CS.zt, zc = CS.zd, hh = zt - zc, x0 = 380, x1 = 1220, zlo = Math.floor(zc - 1), zhi = Math.ceil(Math.max(...pts.map(q => q.z)) + 1);
    const X = d => (x0 + x1)/2 + d*(x1 - x0)/20, Y = z => 420 - (z - zlo)/(zhi - zlo)*320;
    let h = `<text x="${x0}" y="40" font-size="22" font-weight="700" fill="#111">PROFIL TRANSVERSAL — km ${f3(CS.s/1000).replace(',', '+')}</text><text x="${x1}" y="40" font-size="15" fill="#444" text-anchor="end">Scara 1:100</text>`;
    for(let z=zlo; z<=zhi; z++) h += `<text x="${x0 - 14}" y="${Y(z)+5}" font-size="13" text-anchor="end" fill="#111">${z}</text><line x1="${x0-8}" y1="${Y(z)}" x2="${x0}" y2="${Y(z)}" stroke="#111"/>`;
    h += `<line x1="${x0}" y1="${Y(zhi)}" x2="${x0}" y2="${Y(zlo)}" stroke="#111"/>`;
    const kT = seg(k, 0, 0.3), kD = seg(k, 0.3, 0.6), kA = seg(k, 0.65, 0.85);
    h += `<path d="${pts.slice(0, Math.max(2, Math.floor(pts.length*kT))).map((q,i) => (i?'L':'M') + X(q.d) + ' ' + Y(q.z)).join(' ')}" fill="none" stroke="#111" stroke-width="2"/>`;
    if(kD > 0){ const poly = `${X(-b - mm*hh)},${Y(zt)} ${X(-b)},${Y(zc)} ${X(b)},${Y(zc)} ${X(b + mm*hh)},${Y(zt)}`;
      h += `<polygon points="${poly}" fill="rgba(210,20,30,${0.25*kA})" stroke="#d2141e" stroke-width="2.4" stroke-dasharray="${2000*kD} 2000"/>`;
      h += `<text x="${X(0)}" y="${Y(zc) + 22}" font-size="14" fill="#d2141e" text-anchor="middle">b = 1,00 m</text><text x="${X(b + mm*hh/2) + 10}" y="${Y((zt + zc)/2)}" font-size="14" fill="#d2141e">1:1,5</text>`; }
    if(kA > 0) h += `<text x="${X(0)}" y="${Y(zt) - 60}" font-size="20" font-weight="700" fill="#d2141e" text-anchor="middle" opacity="${kA}">A săpătură = (b + m·h)·h = ${f2(hh*(2*b + mm*hh))} m²</text>`;
    // chitara transversala
    const gy = 480, rh = 46, rows = ['Cote teren', 'Distanțe parțiale'];
    rows.forEach((r, i) => h += `<rect x="${x0 - 200}" y="${gy + i*rh}" width="${x1 - x0 + 220}" height="${rh}" fill="none" stroke="#111"/><text x="${x0 - 192}" y="${gy + i*rh + 29}" font-size="15" font-weight="700" fill="#111">${r}</text>`);
    pts.filter((q, i) => i % 2 === 0).forEach((q, i, arr) => { if(i/arr.length > kT) return; const x = X(q.d);
      h += `<line x1="${x}" y1="${Y(q.z)}" x2="${x}" y2="${gy}" stroke="#999" stroke-dasharray="3 3"/><text x="${x + 4}" y="${gy + rh - 6}" font-size="12" fill="#111" transform="rotate(-90 ${x + 4} ${gy + rh - 6})">${f2(q.z)}</text>`;
      if(i > 0) h += `<text x="${x - (X(2) - X(0))/2}" y="${gy + rh + 29}" font-size="12" fill="#111" text-anchor="middle">2,00</text>`; });
    return h;
  }
  // ---------------- volume
  function volume(k){
    const A = R.map(r => r.h*(2*b + mm*r.h));
    let h = `<text x="80" y="44" font-size="22" font-weight="700" fill="#111">CALCULUL VOLUMELOR DE SĂPĂTURĂ — metoda secțiunilor medii</text>
      <text x="80" y="76" font-size="17" fill="#333">V = (A₁ + A₂) / 2 × d   — între două profile transversale consecutive</text>`;
    const cols = ['Profil', 'km', 'Arie săpătură (m²)', 'Distanța (m)', 'Volum parțial (m³)'], cx = [80, 220, 380, 640, 840], ty = 120, rh = 40;
    cols.forEach((c, i) => h += `<text x="${cx[i]}" y="${ty}" font-size="16" font-weight="700" fill="#111">${c}</text>`);
    h += `<line x1="70" y1="${ty + 12}" x2="1080" y2="${ty + 12}" stroke="#111"/>`;
    let V = 0; const nr = Math.floor(R.length*seg(k, 0, 0.75, x=>x) + 0.001);
    R.forEach((r, i) => { if(i >= nr) return; const y = ty + 40 + i*rh, vp = i > 0 ? (A[i-1] + A[i])/2*(r.s - R[i-1].s) : 0; V += vp;
      h += `<text x="${cx[0]}" y="${y}" font-size="15" fill="#111">P${i+1}</text><text x="${cx[1]}" y="${y}" font-size="15" fill="#111">${f3(r.s/1000).replace(',', '+')}</text>
        <text x="${cx[2]}" y="${y}" font-size="15" fill="#111">${f2(A[i])}</text><text x="${cx[3]}" y="${y}" font-size="15" fill="#111">${i > 0 ? f2(r.s - R[i-1].s) : '—'}</text>
        <text x="${cx[4]}" y="${y}" font-size="15" fill="#d2141e">${i > 0 ? f2(vp) : '—'}</text>`; });
    if(k > 0.78) h += `<line x1="70" y1="${ty + 40 + R.length*rh - 26}" x2="1080" y2="${ty + 40 + R.length*rh - 26}" stroke="#111"/><text x="${cx[3]}" y="${ty + 40 + R.length*rh}" font-size="18" font-weight="700" fill="#111">TOTAL</text><text x="${cx[4]}" y="${ty + 40 + R.length*rh}" font-size="20" font-weight="700" fill="#d2141e">${V.toLocaleString('ro-RO', {maximumFractionDigits:1})} m³</text>`;
    // solidul de volum (izometric) — ca în planșa „Calcul volume"
    const ox = 1180, oy = 520, sx = 0.95, kk = seg(k, 0.1, 0.9);
    for(let i=0;i<R.length - 1;i++){ if(i/(R.length - 1) > kk) break; const s0 = R[i].s*sx, s1 = R[i+1].s*sx, a0 = Math.sqrt(A[i])*14, a1 = Math.sqrt(A[i+1])*14;
      const P = (s, a, up) => [ox + s*0.75, oy - s*0.42 - (up ? a : 0)];
      const q = [P(s0, a0, 0), P(s1, a1, 0), P(s1, a1, 1), P(s0, a0, 1)];
      h += `<polygon points="${q.map(v => v.join(',')).join(' ')}" fill="#e3262e" stroke="#7a0b10" stroke-width="1"/><polygon points="${[P(s0,a0,1), P(s1,a1,1), [P(s1,a1,1)[0] + 26, P(s1,a1,1)[1] + 12], [P(s0,a0,1)[0] + 26, P(s0,a0,1)[1] + 12]].map(v => v.join(',')).join(' ')}" fill="#ff5a5f" stroke="#7a0b10" stroke-width="1"/>`; }
    h += `<text x="${ox}" y="${oy + 50}" font-size="15" fill="#444">solidul volumului de săpătură de-a lungul axei</text>`;
    return h;
  }
  const D = [16, 12, 14], T0 = [0, 16, 28];
  const clk = AnimUI.init({duration:42, loop:true, phases:[
    {t:0, text:'Profilul longitudinal: <b>linia terenului</b> (negru) din modelul digital, de-a lungul axei.'},
    {t:4, text:'Peste ea, <b>linia proiectată</b> (roșu) — fundul canalului, cu pante de proiect.'},
    {t:7, text:'„<b>Chitara</b>" de sub profil: pentru fiecare pichet — cota terenului, cota proiectului, adâncimea de săpătură, distanțele și pantele.'},
    {t:16, text:'Profilul transversal: terenul perpendicular pe axă și <b>secțiunea tip</b> a canalului — de aici aria de săpătură.'},
    {t:28, text:'Volumul dintre două profile = media ariilor × distanța dintre ele; însumat pe toată axa → <b>volumul total de terasamente</b>.'}]});
  document.querySelectorAll('.opts button').forEach(b2 => b2.onclick = () => clk.seek(T0[+b2.dataset.s] + 0.01));
  let lt = -1;
  (function frame(){ const t = clk.update(), a = t < T0[1] ? 0 : t < T0[2] ? 1 : 2;
    document.querySelectorAll('.opts button').forEach(b2 => b2.classList.toggle('on', +b2.dataset.s === a));
    if(Math.abs(t - lt) > 0.03){ lt = t; const k = (t - T0[a])/D[a]; sv.innerHTML = [longit, transv, volume][a](Math.min(1, k*1.12)); }
    requestAnimationFrame(frame); })();
})();
</script>
</body></html>
