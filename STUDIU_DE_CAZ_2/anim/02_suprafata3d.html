<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suprafața de nivelare în 3D</title>
<link rel="stylesheet" href="../lib/anim.css">
<script src="../lib/three.min.js"></script><script src="../lib/OrbitControls.js"></script>
<script src="../lib/anim-ui.js"></script><script src="../lib/trv.js"></script>
<script src="../data/teren3d.js"></script><script src="../data/harta.js"></script><script src="../data/trackere.js"></script><script src="../data/rezultate.js"></script>
<style>.leg{right:20px;bottom:150px;width:300px}</style>
</head><body><div id="stage"></div>
<div class="a-title">Suprafața de nivelare în 3D<small>grila de 2 m · exagerare verticală ×4 · trackerele desenate deasupra (tub + masă) · trageți = rotire, rotița = zoom</small></div>
<div class="opts"><button data-k="EG">Teren existent</button><button data-k="FASII_FT">Fâșii separate — FT</button><button data-k="SUPR_FT">Suprafață continuă — FT</button><button data-k="SUPR_XTR_1">Suprafață continuă — XTR 1°</button><button data-k="TRK" class="on">☐ trackere</button></div>
<div class="a-panel leg" id="leg"></div>
<script>
(function(){
  const {seg, ease, lerp} = AnimUI, nf = TRV.nf, T = TEREN3D, H = HARTA, EX = 4, R = REZ.rezultate;
  const nx = T.nx, ny = T.ny, F = T.F, z16 = TRV.b64u16(T.z);
  const i16 = s => { const b = atob(s), u = new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i] = b.charCodeAt(i); return new Int16Array(u.buffer); };
  const DZ = {EG:null, FASII_FT:i16(T.dz_FASII_FT), SUPR_FT:i16(T.dz_SUPR_FT), SUPR_XTR_1:i16(T.dz_SUPR_XTR_1)};
  const Z = H.zona, cx0 = (Z.x0 + Z.x1)/2, cy0 = (Z.y0 + Z.y1)/2, zmid = T.zmin + 4;
  const st = document.getElementById('stage');
  const ren = new THREE.WebGLRenderer({antialias:true, alpha:true}); ren.setPixelRatio(Math.min(2, devicePixelRatio||1)); st.appendChild(ren.domElement);
  const sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(38, 1, 1, 20000);
  sc.add(new THREE.AmbientLight(0xffffff, 0.5)); const dl = new THREE.DirectionalLight(0xffffff, 0.85); dl.position.set(-600, 900, 400); sc.add(dl);
  const ctr = new THREE.OrbitControls(cam, ren.domElement); ctr.enableDamping = true; ctr.maxPolarAngle = Math.PI*0.48;
  function rs(){ ren.setSize(st.clientWidth, st.clientHeight); cam.aspect = st.clientWidth/st.clientHeight; cam.updateProjectionMatrix(); } addEventListener('resize', rs); rs();
  const P = (x, y, z) => new THREE.Vector3(x - cx0, (z - zmid)*EX, -(y - cy0));
  // noduri: x = 0,5 + i*F (local, ca grila de 1 m)
  const pos = new Float32Array(nx*ny*3), uv = new Float32Array(nx*ny*2), idx = [], base = new Float32Array(nx*ny);
  for(let j=0;j<ny;j++) for(let i=0;i<nx;i++){ const k = j*nx + i, v = z16[k], z = v === 65535 ? NaN : T.zmin + v/100; base[k] = z;
    const x = 0.5 + i*F, y = 0.5 + j*F, p = P(x, y, isNaN(z) ? T.zmin : z); pos.set([p.x, p.y, p.z], 3*k); uv.set([x/(H.nx*H.CELL), y/(H.ny*H.CELL)], 2*k); }
  for(let j=0;j<ny-1;j++) for(let i=0;i<nx-1;i++){ const a = j*nx + i, b = a + 1, c = a + nx, d = c + 1; if(!isNaN(base[a] + base[b] + base[c] + base[d])) idx.push(a, c, b, b, c, d); }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); geo.setIndex(idx); geo.computeVertexNormals();
  const cv = document.createElement('canvas'); cv.width = H.nx; cv.height = H.ny; const c2 = cv.getContext('2d');
  const tex = new THREE.CanvasTexture(cv); tex.anisotropy = 8;
  const mesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({map:tex, side:THREE.DoubleSide})); sc.add(mesh);
  const IM = {gri:TRV.img(H.gri), relief:TRV.img(H.relief)}; ['FASII_FT', 'SUPR_FT', 'SUPR_XTR_1'].forEach(k => IM[k] = TRV.img(H['dz_' + k]));
  let texK = null;
  function setTex(k){ if(texK === k) return; const im = k === 'EG' ? IM.relief : IM[k]; if(!IM.gri.complete || !im.complete) return;
    c2.clearRect(0, 0, cv.width, cv.height); c2.drawImage(k === 'EG' ? IM.relief : IM.gri, 0, 0); if(k !== 'EG') c2.drawImage(im, 0, 0); tex.needsUpdate = true; texK = k; }
  // trackere: tub la D + 1,5 m si masa de 2,38 m
  const trkG = new THREE.Group(); sc.add(trkG);
  const tubes = TRK.map(t => { const n = t.s.length, g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n*3*2), 3));
    const l = new THREE.LineSegments(g, new THREE.LineBasicMaterial({color:0x3fd0ff})); trkG.add(l);
    const tl = new THREE.Line(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(new Float32Array(n*3), 3)), new THREE.LineBasicMaterial({color:0xe8eef8})); trkG.add(tl);
    return {t, l, tl}; });
  function setTubes(k){ const kk = k === 'EG' ? 'FASII_FT' : k;
    tubes.forEach(({t, l, tl}) => { const a = l.geometry.attributes.position.array, b = tl.geometry.attributes.position.array, nx_ = -t.uy, ny_ = t.ux;
      t.s.forEach((s, i) => { const z = t.zb + t.d[kk][i]/1000 + 1.5, x = t.x + t.ux*s, y = t.y + t.uy*s;
        const p1 = P(x + nx_*1.19, y + ny_*1.19, z), p2 = P(x - nx_*1.19, y - ny_*1.19, z), pc = P(x, y, z);
        a.set([p1.x, p1.y, p1.z, p2.x, p2.y, p2.z], 6*i); b.set([pc.x, pc.y, pc.z], 3*i); });
      l.geometry.attributes.position.needsUpdate = true; tl.geometry.attributes.position.needsUpdate = true; }); }
  let curK = null, fromZ = null, tSw = 0, showT = true;
  const zfor = k => { const o = new Float32Array(nx*ny); for(let q=0;q<nx*ny;q++) o[q] = base[q] + (DZ[k] ? DZ[k][q]/100 : 0); return o; };
  const ZK = {}; ['EG', 'FASII_FT', 'SUPR_FT', 'SUPR_XTR_1'].forEach(k => ZK[k] = zfor(k));
  let zcur = ZK.EG.slice();
  function morph(k, f){ const A = fromZ, B = ZK[k], p = geo.attributes.position.array;
    for(let q=0;q<nx*ny;q++){ if(isNaN(base[q])) continue; zcur[q] = lerp(A[q], B[q], f); p[3*q + 1] = (zcur[q] - zmid)*EX; }
    geo.attributes.position.needsUpdate = true; if(f >= 1) geo.computeVertexNormals(); }
  let manual = null;
  document.querySelectorAll('.opts [data-k]').forEach(b => b.onclick = () => { if(b.dataset.k === 'TRK'){ showT = !showT; b.textContent = (showT ? '☐' : '☒') + ' trackere'; trkG.visible = showT; return; } manual = b.dataset.k; clk.pause(); });
  const leg = document.getElementById('leg'), lab = ['săpătură > 0,50 m', '0,30–0,50', '0,15–0,30', '0,05–0,15', '', 'umplutură 0,05–0,15', '0,15–0,30', '0,30–0,50', '> 0,50 m'];
  const SEQ = ['EG', 'FASII_FT', 'SUPR_FT', 'SUPR_XTR_1'], T0 = [0, 7, 15, 23], DUR = 32;
  const clk = AnimUI.init({duration:DUR, loop:true, onSeek:() => { manual = null; }, phases:[
    {t:0, text:'<b>Terenul existent</b> și trackerele așezate optim pe el (tub drept).'},
    {t:7, text:'<b>Fâșii separate</b>: lucrări doar sub mese — benzi înguste de săpătură și umplutură, cu trepte între ele.'},
    {t:15, text:'<b>Suprafață continuă — FT</b>: aceeași bandă de ±15 cm pe mese, dar lucrările se racordează lin (≤ 1:10) și nu lasă bălți.'},
    {t:23, text:'<b>Suprafață continuă — XTR 1°</b>: tubul urmărește terenul; rămân doar umplerile depresiunilor închise din zonă.'}]});
  const cam0 = () => { const r = Math.max(Z.x1 - Z.x0, Z.y1 - Z.y0); return new THREE.Vector3(-0.25*r, 0.55*r, 0.6*r); };
  cam.position.copy(cam0()); ctr.target.set(0, 0, 0); let man = false; ren.domElement.addEventListener('pointerdown', () => man = true);
  (function frame(){
    const t = clk.update(), a = T0.reduce((acc, v, i) => t >= v ? i : acc, 0), k = manual || SEQ[a];
    if(k !== curK){ fromZ = zcur.slice(); curK = k; tSw = performance.now(); setTubes(k); }
    const f = ease(Math.min(1, (performance.now() - tSw)/1500)); if(f < 1 || !frame.done){ morph(k, f); frame.done = f >= 1; }
    setTex(k);
    document.querySelectorAll('.opts [data-k]').forEach(b => { if(b.dataset.k !== 'TRK') b.classList.toggle('on', b.dataset.k === k); });
    const r = k === 'EG' ? null : R[k];
    leg.innerHTML = k === 'EG' ? '<h4>Teren existent</h4><div>relief hipsometric, umbrit</div>' : `<h4>${k === 'FASII_FT' ? 'Fâșii separate — FT' : k === 'SUPR_FT' ? 'Suprafață continuă — FT' : 'Suprafață continuă — XTR 1°'}</h4>` +
      H.clr.map((c, q) => q === 4 ? '' : `<div><span class="key" style="background:${c}"></span>${lab[q]}</div>`).join('') + (r ? `<div style="margin-top:8px;color:var(--gold)">săpătură ${nf(r.cut)} mc · umplutură ${nf(r.fill)} mc</div>` : '');
    if(!man){ const ang = t*0.03; const p0 = cam0(); cam.position.set(p0.x*Math.cos(ang) - p0.z*Math.sin(ang), p0.y, p0.x*Math.sin(ang) + p0.z*Math.cos(ang)); cam.lookAt(0, 0, 0); }
    ctr.update(); ren.render(sc, cam);
    requestAnimationFrame(frame);
  })();
})();
</script>
</body></html>
