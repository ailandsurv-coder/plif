<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harta săpătură / umplutură</title>
<link rel="stylesheet" href="../lib/anim.css">
<script src="../lib/anim-ui.js"></script><script src="../lib/trv.js"></script>
<script src="../data/harta.js"></script><script src="../data/trackere.js"></script><script src="../data/rezultate.js"></script>
<style>#zb button{padding:6px 12px}#cv{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.leg{left:20px;bottom:150px;width:300px;font-size:15px}.tot{left:20px;top:240px;width:470px}
#tip{position:absolute;pointer-events:none;display:none;z-index:45}</style>
</head><body>
<canvas id="cv"></canvas>
<div class="a-title">Pasul 5 · Harta săpăturilor și umpluturilor<small>pe fâșiile meselor (2,38 m) · <span id="ntr"></span> de trackere · trageți = deplasare, rotița = zoom, mouse pe o masă = detalii</small></div>
<div class="opts" id="opts">
  <button data-l="ORIG_APR">Inițial — capete pe teren</button><button data-l="FT">FT optimizat</button><button data-l="XTR_075">XTR 0,75°</button><button data-l="XTR_1">XTR 1°</button><button data-l="XTR_2">XTR 2°</button>
  <button data-l="SWIPE">⇆ Comparator FT | XTR 1°</button></div><div id="zb" style="position:absolute;left:28px;top:104px;display:flex;gap:8px;z-index:40"></div>
<div class="a-panel leg" id="leg"></div><div class="a-panel tot" id="tot"></div><div class="a-panel" id="tip"></div>
<script>
(function(){
  const {seg} = AnimUI, nf = TRV.nf, H = HARTA, R = REZ.rezultate;
  const cv = document.getElementById('cv'), ZI = Math.min(1, H.zone.length - 1); document.getElementById('ntr').textContent = TRK.length;
  const m = TRV.Map2D(cv, {W:H.nx*H.CELL, H:H.ny*H.CELL});
  const IM = {gri:TRV.img(H.gri)}; ['ORIG_APR', 'FT', 'XTR_075', 'XTR_1', 'XTR_2'].forEach(s => IM[s] = TRV.img(H['dz_' + s]));
  const base = {img:IM.gri, on:true};
  m.layers = [base];
  let layer = 'ORIG_APR', lock = false, swipe = 0.5;
  const zones = H.zone;
  m.fit(0, H.nx*H.CELL, 0, H.ny*H.CELL);
  // vectori: contururile meselor la zoom mare + comparatorul
  m.vec.push((ctx, m) => {
    const drawL = (img, clipX0, clipX1) => { ctx.save(); ctx.beginPath(); ctx.rect(clipX0, 0, clipX1 - clipX0, cv.clientHeight); ctx.clip();
      const [sx, sy] = m.toS(0, m.H); ctx.drawImage(img, sx, sy, m.W*m.k, m.H*m.k); ctx.restore(); };
    if(layer === 'SWIPE'){ const xs = cv.clientWidth*swipe; drawL(IM.FT, 0, xs); drawL(IM.XTR_1, xs, cv.clientWidth);
      ctx.fillStyle = '#fff'; ctx.fillRect(xs - 2, 0, 4, cv.clientHeight); ctx.font = '700 22px Segoe UI'; ctx.fillStyle = '#ffc940'; ctx.textAlign = 'right'; ctx.fillText('FT — tub drept', xs - 14, 150);
      ctx.fillStyle = '#5be39a'; ctx.textAlign = 'left'; ctx.fillText('XTR 1° ⇢', xs + 14, 150); ctx.textAlign = 'start';
      ctx.beginPath(); ctx.arc(xs, cv.clientHeight/2, 20, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.fillStyle = '#04111f'; ctx.font = '700 18px Segoe UI'; ctx.fillText('⇆', xs - 9, cv.clientHeight/2 + 6); }
    else drawL(IM[layer], 0, cv.clientWidth);
    if(m.k > 1.2){ ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
      TRK.forEach(t => { const nx = -t.uy, ny = t.ux, w = 1.19; const P = [[t.x + nx*w, t.y + ny*w], [t.x + t.ux*t.L + nx*w, t.y + t.uy*t.L + ny*w], [t.x + t.ux*t.L - nx*w, t.y + t.uy*t.L - ny*w], [t.x - nx*w, t.y - ny*w]];
        ctx.beginPath(); P.forEach((p, i) => { const [a, b] = m.toS(...p); i ? ctx.lineTo(a, b) : ctx.moveTo(a, b); }); ctx.closePath(); ctx.stroke(); }); }
    if(hov){ const t = hov, nx = -t.uy, ny = t.ux, w = 1.6; ctx.strokeStyle = '#3fd0ff'; ctx.lineWidth = 3; ctx.beginPath();
      [[t.x + nx*w, t.y + ny*w], [t.x + t.ux*t.L + nx*w, t.y + t.uy*t.L + ny*w], [t.x + t.ux*t.L - nx*w, t.y + t.uy*t.L - ny*w], [t.x - nx*w, t.y - ny*w]].forEach((p, i) => { const [a, b] = m.toS(...p); i ? ctx.lineTo(a, b) : ctx.moveTo(a, b); }); ctx.closePath(); ctx.stroke(); }
    TRV.scaleBar(ctx, m, 40, 200);
  });
  // tooltip pe trackere
  let hov = null; const tip = document.getElementById('tip');
  m.onmove = (x, y, e) => {
    if(dragSw){ swipe = Math.max(0.05, Math.min(0.95, e.clientX/cv.clientWidth)); return; }
    hov = TRK.find(t => { const rx = x - t.x, ry = y - t.y, s = rx*t.ux + ry*t.uy, o = -rx*t.uy + ry*t.ux; return s >= 0 && s <= t.L && Math.abs(o) <= 1.3; }) || null;
    if(hov){ const k = layer === 'SWIPE' ? 'FT' : layer, e2 = hov.ev; tip.style.display = 'block'; tip.style.left = (e.clientX + 18) + 'px'; tip.style.top = (e.clientY + 10) + 'px';
      tip.innerHTML = `<h4>Tracker ${hov.id} · ${nf(hov.L, 1)} m · ${hov.p.length} piloți</h4><table><tr><th></th><th>săp.</th><th>umpl.</th></tr>` +
        ['ORIG_APR', 'FT', 'XTR_1'].map(s => `<tr><td>${TRV.SCN[s].s}</td><td>${nf(e2[s][0], 1)}</td><td>${nf(e2[s][1], 1)}</td></tr>`).join('') + '</table>'; }
    else tip.style.display = 'none';
  };
  let dragSw = false;
  cv.addEventListener('pointerdown', e => { if(layer === 'SWIPE' && Math.abs(e.clientX - cv.clientWidth*swipe) < 30){ dragSw = true; m.fixed = true; } });
  addEventListener('pointerup', () => { dragSw = false; m.fixed = false; });
  // butoane
  const zb = document.getElementById('zb');
  zb.innerHTML = zones.map((z, k) => `<button data-z="${k}">${z.nume}</button>`).join('') + '<button data-z="-1">Tot situl</button>';
  zb.querySelectorAll('button').forEach(b => b.onclick = () => { lock = true; clk.pause(); const z = +b.dataset.z < 0 ? {x0:0, x1:H.nx*H.CELL, y0:0, y1:H.ny*H.CELL} : zones[+b.dataset.z]; m.flyTo(z.x0, z.x1, z.y0, z.y1); });
  document.querySelectorAll('#opts [data-l]').forEach(b => b.onclick = () => { layer = b.dataset.l; lock = true; clk.pause(); });
  const lab = ['săpătură > 0,50 m', '0,30–0,50', '0,15–0,30', '0,05–0,15', '', 'umplutură 0,05–0,15', '0,15–0,30', '0,30–0,50', '> 0,50 m'];
  document.getElementById('leg').innerHTML = '<h4>Adâncimea lucrărilor (în afara benzii ±15 cm)</h4>' + H.clr.map((c, k) => k === 4 ? '' : `<div><span class="key" style="background:${c}"></span>${lab[k]}</div>`).join('') +
    '<div><span class="key" style="background:rgba(91,227,154,.6)"></span>masă în bandă — fără lucrări</div>';
  const tot = document.getElementById('tot');
  function totaluri(){ const rows = ['ORIG_APR', 'FT', 'XTR_075', 'XTR_1', 'XTR_2'].map(k => { const r = R[k], on = k === layer || (layer === 'SWIPE' && (k === 'FT' || k === 'XTR_1'));
      return `<tr style="${on ? 'background:rgba(63,208,255,.15)' : ''}"><td><span class="key" style="background:${TRV.SCN[k].c}"></span>${TRV.SCN[k].s}</td><td>${nf(r.cut)}</td><td>${nf(r.fill)}</td><td><b>${nf(r.cut + r.fill)}</b></td><td>${nf((r.a_cut + r.a_fill)/1e4, 2)}</td></tr>`; }).join('');
    tot.innerHTML = `<h4>Totaluri pe sit (${TRK.length} trackere)</h4><table><tr><th></th><th>săp. mc</th><th>umpl. mc</th><th>total</th><th>ha afect.</th></tr>${rows}</table>`; }
  const zz = zones[ZI], ALL = {x0:0, x1:H.nx*H.CELL, y0:0, y1:H.ny*H.CELL},
    ZOOM = {x0:zz.x0 + (zz.x1 - zz.x0)*0.2, x1:zz.x0 + (zz.x1 - zz.x0)*0.7, y0:zz.y0 + (zz.y1 - zz.y0)*0.25, y1:zz.y0 + (zz.y1 - zz.y0)*0.75};
  const T0 = [0, 6, 12, 18, 26, 34], DUR = 42;
  const clk = AnimUI.init({duration:DUR, loop:true, onSeek:() => { lock = false; }, phases:[
    {t:0, text:'<b>Proiectul inițial</b> (capete pe teren): ' + nf(R.ORIG_APR.cut + R.ORIG_APR.fill) + ' mc pe ' + nf((R.ORIG_APR.a_cut + R.ORIG_APR.a_fill)/1e4, 2) + ' ha de mese afectate.'},
    {t:6, text:'<b>FT optimizat</b>: ' + nf(R.FT.cut + R.FT.fill) + ' mc — tubul drept, dar așezat optim. ' + R.FT.trk_zero + ' din ' + TRK.length + ' de trackere nu mai au lucrări.'},
    {t:12, text:'<b>XTR 1°</b>: ' + nf(R.XTR_1.cut + R.XTR_1.fill) + ' mc — rămân doar ' + (TRK.length - R.XTR_1.trk_zero) + ' trackere cu mici corecții.'},
    {t:18, text:'Mai aproape, pe ' + H.zone[ZI].nume + ': inițial…'},
    {t:26, text:'…FT optimizat…'},
    {t:34, text:'…și comparatorul: <b>FT în stânga, XTR 1° în dreapta</b> — trageți de linia albă.'}]});
  (function frame(){
    const t = clk.update(), a = T0.reduce((acc, v, i) => t >= v ? i : acc, 0);
    if(!lock){ const want = ['ORIG_APR', 'FT', 'XTR_1', 'ORIG_APR', 'FT', 'SWIPE'][a];
      if(want !== layer) layer = want;
      const z = a >= 3 ? ZOOM : ALL;
      if(!m.anim && (frame.z !== z)){ m.flyTo(z.x0, z.x1, z.y0, z.y1, 1.6); frame.z = z; }
      if(a === 5) swipe = 0.5 + 0.18*Math.sin((t - 34)*0.9); }
    document.querySelectorAll('#opts [data-l]').forEach(b => b.classList.toggle('on', b.dataset.l === layer));
    totaluri(); m.draw();
    requestAnimationFrame(frame);
  })();
})();
</script>
</body></html>
