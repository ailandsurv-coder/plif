<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dimensionarea rigolei</title>
<link rel="stylesheet" href="../lib/anim.css">
<script src="../lib/anim-ui.js"></script><script src="../lib/trv.js"></script><script src="../data/drenaj.js"></script>
<style>#sv{position:absolute;left:1%;top:110px;width:56%;height:calc(100% - 270px)}
.inp{right:20px;top:20px;width:40%;max-height:calc(100% - 190px);overflow:auto}
.inp label{display:grid;grid-template-columns:1.5fr 1.6fr .9fr;gap:10px;align-items:center;margin:5px 0}
.inp input{width:100%}.inp .v{text-align:right;color:var(--gold);font-variant-numeric:tabular-nums}
.res td{padding:4px 10px}.res tr.hl{background:rgba(63,208,255,.18)}
#pre{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px;font-size:15px;width:100%;margin-bottom:6px}</style>
</head><body>
<div class="a-title">Dimensionarea unei rigole — pas cu pas<small>formula rațională (STAS 1846-2) + Manning · valorile se pot modifica</small></div>
<svg id="sv" viewBox="0 0 900 640" preserveAspectRatio="xMidYMid meet"></svg>
<div class="a-panel inp"><h4>Date de intrare</h4><select id="pre"></select><div id="ins"></div><h4 style="margin-top:12px">Calcul</h4><table class="res" id="res"></table></div>
<script>
(function(){
  const {seg} = AnimUI, nf = TRV.nf, P = DRENAJ.par;
  const RG = DRENAJ.seg.filter(s => s.rig).sort((a, b) => b.Q - a.Q);
  const IN = [
    ['A', 'Bazin de recepție A', 'ha', 0.1, 30, 0.05, 2], ['Lmax', 'Drum maxim de scurgere', 'm', 20, 1200, 5, 0], ['Sb', 'Panta medie a bazinului', '%', 0.2, 10, 0.05, 2],
    ['S', 'Panta rigolei S', '%', 0.2, 10, 0.05, 2], ['PHI', 'Coeficient de scurgere Φ', '', 0.1, 0.9, 0.05, 2], ['I10', 'i(10 min), frecvența ' + P.FREC, 'l/s·ha', 80, 350, 5, 0],
    ['N', 'Rugozitate Manning n', '', 0.015, 0.05, 0.001, 3], ['B', 'Lățimea la fund b', 'm', 0.2, 1.0, 0.05, 2], ['M', 'Taluz 1 : m', '', 1, 3, 0.25, 2]];
  const V = {A:1, Lmax:200, Sb:2, S:1, PHI:P.PHI, I10:200, N:P.N_MAN, B:P.B_RIG, M:P.M_TAL};
  const pre = document.getElementById('pre');
  pre.innerHTML = '<option value="-1">— valori manuale —</option>' + RG.slice(0, 25).map((s, k) => `<option value="${k}">rigola ${s.id}: A = ${nf(s.A, 2)} ha · Q = ${nf(s.Q)} l/s</option>`).join('');
  function load(k){ const s = RG[k]; Object.assign(V, {A:s.A, Lmax:s.Lmax, Sb:Math.max(0.2, Math.min(10, ((s.tc - 10)/0.0195/Math.pow(s.Lmax, 0.77))**(-1/0.385)*100)), S:s.S*100}); draw(); }
  pre.onchange = () => { if(+pre.value >= 0) load(+pre.value); };
  const ins = document.getElementById('ins');
  function draw(){ ins.innerHTML = IN.map(([k, l, u, a, b, st, d]) => `<label><span>${l}</span><input type="range" min="${a}" max="${b}" step="${st}" value="${V[k]}" data-k="${k}"><span class="v">${nf(V[k], d)} ${u}</span></label>`).join('');
    ins.querySelectorAll('input').forEach(e => e.oninput = () => { V[e.dataset.k] = +e.value; e.nextElementSibling.textContent = nf(V[e.dataset.k], IN.find(x => x[0] === e.dataset.k)[6]) + ' ' + IN.find(x => x[0] === e.dataset.k)[2]; pre.value = -1; }); }
  draw(); load(0); pre.value = 0;
  function calc(){
    const tc = 10 + 0.0195*Math.pow(V.Lmax, 0.77)*Math.pow(V.Sb/100, -0.385);
    const IA = V.I10*Math.pow(20, 0.75), i = IA/Math.pow(tc + 10, 0.75);
    const Q = P.M_RET*V.PHI*i*V.A/1000, S = V.S/100;
    let lo = 1e-4, hi = 3, h = 0; for(let k=0;k<60;k++){ h = (lo + hi)/2; const A = (V.B + V.M*h)*h, Pm = V.B + 2*h*Math.sqrt(1 + V.M*V.M), q = A*Math.pow(A/Pm, 2/3)*Math.sqrt(S)/V.N; if(q < Q) lo = h; else hi = h; }
    const A = (V.B + V.M*h)*h, v = Q/A, H = Math.max(0.4, Math.ceil((h + P.GARDA)/0.05)*0.05);
    return {tc, i, Q, h, A, v, H, Bs:V.B + 2*V.M*H};
  }
  const STEP = [0, 6, 12, 18, 26, 34], DUR = 42;
  const clk = AnimUI.init({duration:DUR, loop:true, phases:[
    {t:0, text:'<b>1 · Bazinul</b>: suprafața care se scurge spre secțiunea rigolei, citită din harta de acumulare (D8).'},
    {t:6, text:'<b>2 · Timpul de concentrare</b>: tc = 10 min (timp de intrare) + Kirpich pe cel mai lung drum de scurgere.'},
    {t:12, text:'<b>3 · Intensitatea ploii</b> i(tc), la frecvența de calcul — din curbele STAS 9470-73 (aici ipoteză: i(10 min) = 200 l/s·ha).'},
    {t:18, text:'<b>4 · Debitul</b>: Q = m · Φ · i · A (m = 0,8 coeficient de întârziere, Φ = coeficientul de scurgere al suprafeței).'},
    {t:26, text:'<b>5 · Secțiunea</b>: Manning — adâncimea normală h pentru care rigola trapezoidală transportă Q la panta S. Se adaugă garda de 15 cm.'},
    {t:34, text:'<b>6 · Verificarea vitezei</b>: rigolă înierbată până la 1,2 m/s; peste — dale, pereu sau trepte de disipare.'}]});
  const sv = document.getElementById('sv'), res = document.getElementById('res');
  (function frame(){
    const t = clk.update(), a = STEP.reduce((acc, v, i) => t >= v ? i : acc, 0), R = calc();
    const rows = [['Bazin A', nf(V.A, 2) + ' ha', 0], ['Timp de concentrare tc', nf(R.tc, 1) + ' min', 1], ['Intensitate i(tc)', nf(R.i) + ' l/s·ha', 2],
      ['Debit Q', nf(R.Q*1000) + ' l/s', 3], ['Adâncime normală h', nf(R.h*100) + ' cm', 4], ['Adâncime adoptată H', nf(R.H, 2) + ' m', 4], ['Lățime la coronament', nf(R.Bs, 2) + ' m', 4],
      ['Viteza v', `<span style="color:${R.v > P.V_ADM ? '#ff8a8a' : '#5be39a'}">${nf(R.v, 2)} m/s</span>`, 5], ['Concluzie', R.v > P.V_ADM ? '<span style="color:#ff8a8a">protecție necesară</span>' : '<span style="color:#5be39a">rigolă înierbată OK</span>', 5]];
    res.innerHTML = rows.map(([l, v, s]) => `<tr class="${s === a ? 'hl' : ''}"><td>${l}</td><td style="text-align:right"><b>${v}</b></td></tr>`).join('');
    // sectiunea transversala
    const sc = 600/Math.max(R.Bs + 0.6, 1.6), cx = 450, yb = 470, Ht = R.H*sc, bh = V.B/2*sc, mh = V.M*Ht;
    const hw = Math.min(R.h, R.H)*sc*(a >= 4 ? seg(t, 26, 30) : 0), wv = Math.sin(t*3)*3;
    let h = `<rect x="0" y="0" width="900" height="640" fill="transparent"/>`;
    h += `<path d="M 40 ${yb - Ht} L ${cx - bh - mh} ${yb - Ht} L ${cx - bh} ${yb} L ${cx + bh} ${yb} L ${cx + bh + mh} ${yb - Ht} L 860 ${yb - Ht} L 860 600 L 40 600 Z" fill="#6b5236" stroke="#c9a46a" stroke-width="3"/>`;
    h += `<path d="M ${cx - bh - mh} ${yb - Ht} L ${cx - bh} ${yb} L ${cx + bh} ${yb} L ${cx + bh + mh} ${yb - Ht}" fill="none" stroke="#5be39a" stroke-width="5" stroke-dasharray="2 7" opacity=".8"/>`;
    if(hw > 0){ const wx = V.M*hw; h += `<path d="M ${cx - bh - wx} ${yb - hw + wv} Q ${cx} ${yb - hw - wv} ${cx + bh + wx} ${yb - hw + wv} L ${cx + bh} ${yb} L ${cx - bh} ${yb} Z" fill="rgba(63,160,255,.75)"/>`;
      h += `<text x="${cx}" y="${yb - hw/2 + 8}" fill="#fff" font-size="22" font-weight="700" text-anchor="middle">h = ${nf(R.h*100)} cm · v = ${nf(R.v, 2)} m/s</text>`; }
    h += `<line x1="${cx + bh + mh + 20}" x2="${cx + bh + mh + 20}" y1="${yb}" y2="${yb - Ht}" stroke="#ffc940" stroke-width="2"/><text x="${cx + bh + mh + 30}" y="${yb - Ht/2}" fill="#ffc940" font-size="22">H = ${nf(R.H, 2)} m</text>`;
    h += `<text x="${cx}" y="${yb + 34}" fill="#b4c0d4" font-size="20" text-anchor="middle">b = ${nf(V.B, 2)} m · taluz 1:${nf(V.M, 2)} · coronament ${nf(R.Bs, 2)} m</text>`;
    // ploaia + debitul
    if(a <= 3){ for(let k=0;k<40;k++){ const x = 60 + ((k*97) % 780), y = ((t*260 + k*53) % 300); h += `<line x1="${x}" y1="${y}" x2="${x - 4}" y2="${y + 14}" stroke="#9fd7ff" stroke-width="2" opacity=".6"/>`; } }
    h += `<text x="450" y="60" fill="#3fd0ff" font-size="30" font-weight="800" text-anchor="middle">Q = ${nf(R.Q*1000)} l/s</text>`;
    sv.innerHTML = h;
    requestAnimationFrame(frame);
  })();
})();
</script>
</body></html>
