<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stații totale, trepiede și accesorii</title>
<link rel="stylesheet" href="../lib/anim.css">
<script src="../lib/anim-ui.js"></script>
<style>
  .a-caption{display:none}
  #tabs{position:absolute;left:24px;right:24px;top:100px;display:flex;gap:8px}
  #tabs button{flex:1;background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:9px;font-size:clamp(12px,1vw,18px);cursor:pointer;font-family:inherit}
  #tabs button.on{background:var(--cyan);color:#04111f;font-weight:700}
  #sv{position:absolute;left:24px;top:160px;width:48%;height:calc(100vh - 270px)}
  #txt{right:24px;top:160px;width:calc(52% - 70px);bottom:100px;overflow:hidden;font-size:clamp(15px,1.38vw,25px)}
  #txt .tt{font-size:1.6em;font-weight:700;margin-bottom:8px}
  #txt .lb2{color:var(--gold);font-weight:700;margin-top:12px}
  #txt p{margin:4px 0;line-height:1.45}
  #dots{position:absolute;left:24px;width:48%;bottom:92px;display:flex;justify-content:center;gap:8px}
  #dots i{width:12px;height:12px;border-radius:50%;background:#2a3d63;cursor:pointer}#dots i.on{background:var(--cyan)}
  .fade{animation:fd .5s ease}@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head><body>
<div class="a-title">Stații totale, trepiede și accesorii<small>Echipamentul de teren, pe rând — ce este, la ce folosește, la ce trebuie atenție</small></div>
<div id="tabs"></div>
<svg id="sv" viewBox="0 0 700 640"></svg>
<div class="a-panel" id="txt"></div>
<div id="dots"></div>
<script>
(function(){
  const {seg, ease} = AnimUI;
  // ---------- piese de desen refolosibile
  const leg = (x1,y1,x2,y2,c,w) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w||12}" stroke-linecap="round"/>`;
  const tripod = (cx, top, col, h) => `${leg(cx-14,top+10,cx-150,top+h,col)}${leg(cx,top+10,cx+10,top+h+10,col)}${leg(cx+14,top+10,cx+150,top+h,col)}
     <rect x="${cx-70}" y="${top}" width="140" height="18" rx="5" fill="#5d6a80"/>${[cx-150,cx+10,cx+150].map(x => `<path d="M ${x-6} ${top+h-2} l 6 22 l 6 -22 z" fill="#b8c2d0"/>`).join('')}`;
  const station = (cx, base, o) => { o = o||{}; const body = o.body||'#e8edf4', acc = o.acc||'#ffc940';
    return `<path d="M ${cx-55} ${base} L ${cx-46} ${base-22} L ${cx+46} ${base-22} L ${cx+55} ${base} Z" fill="#2c3a52"/>
      <rect x="${cx-70}" y="${base-56}" width="140" height="34" rx="8" fill="${body}" stroke="#2c3a52" stroke-width="2"/>
      <path d="M ${cx-56} ${base-56} L ${cx-44} ${base-190} L ${cx+44} ${base-190} L ${cx+56} ${base-56} Z" fill="${body}" stroke="#2c3a52" stroke-width="2"/>
      <path d="M ${cx-34} ${base-190} L ${cx-34} ${base-222} Q ${cx} ${base-238} ${cx+34} ${base-222} L ${cx+34} ${base-190}" fill="none" stroke="#2c3a52" stroke-width="9" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${base-140}" r="34" fill="#cdd6e2" stroke="${acc}" stroke-width="3"/>
      <rect x="${cx-62}" y="${base-160}" width="150" height="42" rx="16" fill="#2c3a52"/><rect x="${cx+72}" y="${base-164}" width="10" height="50" rx="3" fill="${acc}"/>
      <rect x="${cx-100}" y="${base-120}" width="46" height="60" rx="5" fill="#1b2840" stroke="#9fb4d0"/><rect x="${cx-95}" y="${base-114}" width="36" height="20" fill="#9ee6a8"/>
      ${o.motor ? `<circle cx="${cx+24}" cy="${base-90}" r="12" fill="none" stroke="${acc}" stroke-width="5" stroke-dasharray="5 4"/><circle cx="${cx}" cy="${base-140}" r="14" fill="none" stroke="${acc}" stroke-width="5" stroke-dasharray="5 4"/>` : ''}
      ${o.cam ? `<rect x="${cx+10}" y="${base-176}" width="30" height="14" rx="3" fill="#111"/><circle cx="${cx+25}" cy="${base-169}" r="5" fill="#3fd0ff"/>` : ''}`; };
  const prism = (x, y, r, col) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${col||'#d9a21b'}" stroke="#6b4e0c" stroke-width="3"/><circle cx="${x}" cy="${y}" r="${r*0.62}" fill="#9fd8ff" stroke="#fff" stroke-width="2"/>
      <path d="M ${x} ${y-r*0.62} L ${x} ${y+r*0.62} M ${x-r*0.54} ${y-r*0.31} L ${x+r*0.54} ${y+r*0.31} M ${x-r*0.54} ${y+r*0.31} L ${x+r*0.54} ${y-r*0.31}" stroke="#5aa8d8" stroke-width="1.5"/>`;
  const ground = `<rect x="0" y="560" width="700" height="80" fill="#13202f"/><line x1="0" y1="560" x2="700" y2="560" stroke="#2f4566"/>`;

  // ---------- articolele
  const IT = [
    {cat:0, t:'Stația totală clasică (cu operator)', d:f => ground + tripod(350, 360, '#c9a46a', 200) + station(350, 362),
     rol:'Măsoară unghiuri orizontale și verticale și distanțe; calculează coordonatele în teren. Operatorul vizează manual fiecare țintă.',
     car:'Precizie unghiulară 1″–5″ (≈ 3ᶜᶜ–15ᶜᶜ); distanțe cu prismă până la 3–5 km, cu precizie de 1–2 mm + 1,5–2 ppm; afișaj pe ambele fețe.',
     sfat:'Precizia unghiulară se alege după lucrare: 5″ ajung pentru ridicări curente, 1″–2″ pentru rețele de sprijin și monitorizare.'},
    {cat:0, t:'Stația totală robotizată', d:f => ground + tripod(250, 360, '#c9a46a', 200) + station(250, 362, {motor:1}) +
       `<line x1="330" y1="${222}" x2="${560}" y2="${250 + 20*Math.sin(f*6)}" stroke="#ffc940" stroke-width="2" stroke-dasharray="7 5"/>
        <line x1="560" y1="${250+20*Math.sin(f*6)}" x2="560" y2="560" stroke="#ddd" stroke-width="6"/>${prism(560, 250 + 20*Math.sin(f*6), 22)}
        <rect x="575" y="${360}" width="44" height="60" rx="6" fill="#1b2840" stroke="#3fd0ff"/><rect x="580" y="366" width="34" height="28" fill="#3fd0ff" opacity=".7"/>`,
     rol:'Servomotoare pe ambele axe și recunoaștere automată a țintei (ATR): stația caută, găsește și urmărește singură prisma.',
     car:'Lucrul se face de la prismă, cu controlerul — un singur operator. Comunicare radio sau Bluetooth cu controlerul.',
     sfat:'Folosește o prismă 360° (nu trebuie întoarsă spre stație) și verifică periodic calibrarea ATR, separat de colimația lunetei.'},
    {cat:0, t:'Stația totală cu imagine și scanare', d:f => { let h = ground + tripod(220, 360, '#c9a46a', 200) + station(220, 362, {motor:1, cam:1});
       const n = Math.floor(ease(f)*300); for(let i=0;i<n;i++){ const r = Math.floor(i/25), c = i%25; h += `<circle cx="${430+c*9}" cy="${150+r*30+(c%2)*4}" r="2.5" fill="${['#3fd0ff','#5be39a','#ffc940'][r%3]}"/>`; }
       return h + `<rect x="420" y="140" width="240" height="380" fill="none" stroke="#6b7690" stroke-dasharray="6 6"/>`; },
     rol:'Pe lângă măsurătorile clasice, înregistrează imagini și nori de puncte (scanare cu sute sau mii de puncte pe secundă).',
     car:'Camere integrate (prezentare imagine pe controler), scanare reflectorless, legare directă cu GNSS.',
     sfat:'Utile la taluzuri, fațade, poduri și construcții hidrotehnice, unde detaliile complete contează mai mult decât un singur punct.'},
    {cat:1, t:'Trepiedul din lemn', d:f => ground + tripod(350, 260, '#b5874a', 300) + `<text x="350" y="240" fill="#e8c48a" font-size="22" text-anchor="middle">cap plat · șurub de prindere 5/8″</text>`,
     rol:'Suportul stabil al stației totale sau al prismei; picioarele telescopice permit așezarea pe teren denivelat.',
     car:'Lemnul are dilatare termică mică și amortizează vibrațiile — preferat pentru măsurători de precizie.',
     sfat:'Picioarele se înfig ferm în teren (pedala!), capul se aduce aproximativ orizontal înainte de calare; cu vânt puternic se lestează.'},
    {cat:1, t:'Trepiedul din aluminiu', d:f => ground + tripod(350, 260, '#b9c4d2', 300),
     rol:'Același rol, dar mai ușor de transportat — potrivit pentru lucrări cu multe stații și deplasări lungi.',
     car:'Ușor și rezistent la umezeală, dar se dilată mai mult la căldură și e mai sensibil la vibrații și vânt.',
     sfat:'La soare puternic stația se poate „mișca" din cauza dilatării — se verifică orientarea la sfârșitul stației.'},
    {cat:1, t:'Mini-trepiedul și bipodul pentru baston', d:f => ground + tripod(220, 430, '#9aa6b8', 120) +
       `${leg(500,560,500,220,'#ddd',7)}${leg(500,330,420,560,'#9aa6b8',6)}${leg(500,330,580,560,'#9aa6b8',6)}${prism(500, 220, 20)}<circle cx="500" cy="360" r="9" fill="#bfe9b0" stroke="#333"/>`,
     rol:'Mini-trepiedul ține ținte sau mini-prisme aproape de sol; bipodul fixează bastonul cu prisma pe verticală.',
     car:'Bipodul elimină tremurul operatorului: bastonul rămâne calat pe toată durata măsurării.',
     sfat:'Pentru puncte de detaliu e suficient bastonul ținut în mână; pentru puncte de sprijin și trasări precise se folosește bipodul.'},
    {cat:2, t:'Ambaza (tribrach)', d:f => `<g transform="translate(350,330) scale(2.2)"><path d="M -70 40 L -56 0 L 56 0 L 70 40 Z" fill="#2c3a52" stroke="#9fb4d0"/>
       ${[-48,0,48].map(x => `<rect x="${x-9}" y="4" width="18" height="34" rx="4" fill="#9aa6b8"/>`).join('')}<circle cx="0" cy="-10" r="16" fill="#bfe9b0" stroke="#333" stroke-width="2"/><circle cx="${4*Math.sin(f*6)}" cy="-10" r="5" fill="#fff"/>
       <line x1="0" y1="40" x2="0" y2="${40 + 70*seg(f,0.2,0.5)}" stroke="#ff3030" stroke-width="2"/><circle cx="0" cy="${40 + 70*seg(f,0.2,0.5)}" r="${4*seg(f,0.45,0.55)}" fill="#ff3030"/></g>
       <text x="350" y="560" fill="#ff8080" font-size="20" text-anchor="middle">fasciculul laser de centrare cade pe reper</text>`,
     rol:'Leagă instrumentul de trepied: 3 șuruburi de calare, nivelă sferică și dispozitiv de centrare (optic sau laser).',
     car:'Instrumentul sau prisma se pot scoate și schimba între ele fără a pierde centrarea — „centrare forțată" la drumuiri.',
     sfat:'Nivelele și centrarea optică/laser ale ambazei se verifică periodic; o centrare greșită de 2 mm intră direct în coordonate.'},
    {cat:3, t:'Jalonul', d:f => ground + [0,1,2].map(j => `<g transform="translate(${250 + j*100},0)">${Array.from({length:4}, (_,i) => `<rect x="-9" y="${160+i*100}" width="18" height="100" fill="${i%2 ? '#fff' : '#d33'}"/>`).join('')}<path d="M -9 560 l 9 26 l 9 -26 z" fill="#888"/></g>`).join(''),
     rol:'Semnalizarea punctelor și a aliniamentelor; vizarea de la distanță, jalonarea traseelor de canale și drumuri.',
     car:'Lemn sau metal, 2 m, segmente colorate alternativ roșu–alb (de obicei 50 cm); vârf metalic.',
     sfat:'Jalonul se ține vertical (cu nivelă sau verificat cu firul cu plumb); o înclinare de 1° la 2 m înseamnă 3,5 cm abatere la vârf.'},
    {cat:3, t:'Bastonul telescopic pentru prismă', d:f => { const ext = 60*Math.sin(f*Math.PI*2)**2;
       return ground + `${leg(350,560,350,200-ext,'#ddd',8)}<rect x="343" y="${300}" width="14" height="260" fill="#b9c4d2"/>${prism(350, 190-ext, 26)}
         <circle cx="350" cy="380" r="11" fill="#bfe9b0" stroke="#333"/><circle cx="350" cy="380" r="4" fill="#fff"/>
         <text x="380" y="${260-ext/2}" fill="#ffc940" font-size="22">h prismă = ${(2.0 + ext/100).toFixed(2).replace('.',',')} m</text>`; },
     rol:'Ține prisma deasupra punctului măsurat; înălțimea țintei se citește pe scala gradată.',
     car:'Telescopic (de obicei până la 2,15–5 m), cu nivelă sferică și vârf ascuțit; varianta mini pentru spații înguste.',
     sfat:'Înălțimea prismei se introduce corect în stație la fiecare schimbare — eroarea trece integral în cota punctului.'},
    {cat:4, t:'Prisma circulară (standard)', d:f => ground + `${leg(350,560,350,260,'#ddd',8)}${prism(350, 240, 70)}<rect x="270" y="300" width="160" height="16" fill="#d33" opacity=".85"/>`,
     rol:'Reflectorul de bază: întoarce fasciculul EDM exact spre stație, pentru distanțe mari și precise.',
     car:'Bătaie de câțiva km; trebuie orientată spre stație. Are o <b>constantă</b> proprie, care se introduce în stație.',
     sfat:'Constanta greșită produce aceeași eroare pe fiecare distanță. Exemplu, în sistemul Leica: prisma circulară GPR1 = 0,0 mm, mini-prisma = +17,5 mm.'},
    {cat:4, t:'Mini-prisma', d:f => ground + `${leg(350,560,350,330,'#ddd',6)}${prism(350, 315, 30)}`,
     rol:'Prismă mică pentru distanțe scurte, detalii, construcții și monitorizare (montată fix pe obiectul urmărit).',
     car:'Bătaie mai mică decât prisma circulară; constantă diferită de a prismei mari.',
     sfat:'La schimbarea prismei se schimbă și constanta în stație — cea mai frecventă greșeală pe șantier.'},
    {cat:4, t:'Prisma 360°', d:f => { let h = ground + `${leg(350,560,350,300,'#ddd',8)}<defs><clipPath id="c360"><rect x="280" y="180" width="140" height="120" rx="14"/></clipPath></defs>
       <rect x="276" y="172" width="148" height="12" rx="4" fill="#d9a21b"/><rect x="276" y="296" width="148" height="12" rx="4" fill="#d9a21b"/><g clip-path="url(#c360)"><rect x="280" y="180" width="140" height="120" fill="#2a5a7a"/>`;
       for(let r=0;r<2;r++) for(let i=-1;i<5;i++){ const x = 280 + i*46 + ((f*92 + r*23) % 46); h += `<polygon points="${x},${185+r*58} ${x+44},${185+r*58} ${x+22},${237+r*58}" fill="${(i+r)%2 ? '#9fd8ff' : '#6bb8e6'}" stroke="#fff" stroke-width="1.5"/>`; }
       return h + `</g><text x="350" y="350" fill="#b4c0d4" font-size="20" text-anchor="middle">6 prisme dispuse în cerc</text>`; },
     rol:'Reflector din mai multe prisme, vizibil din orice direcție — pentru stații robotizate și trasare.',
     car:'Nu trebuie orientat spre stație; precizia este ceva mai mică decât la prisma circulară (câțiva mm).',
     sfat:'Ideală pentru urmărire continuă (lock) și pentru ghidajul utilajelor; constanta proprie se setează în stație.'},
    {cat:4, t:'Ținta reflectorizantă și măsurarea fără reflector', d:f => ground + `<rect x="420" y="120" width="200" height="420" fill="#3a4258"/>
       <g transform="translate(470,220)"><rect width="60" height="60" fill="#e9e9e9"/><circle cx="30" cy="30" r="20" fill="none" stroke="#111" stroke-width="4"/><line x1="30" y1="4" x2="30" y2="56" stroke="#111" stroke-width="3"/><line x1="4" y1="30" x2="56" y2="30" stroke="#111" stroke-width="3"/></g>
       <line x1="80" y1="350" x2="420" y2="${400+40*Math.sin(f*5)}" stroke="#ff3030" stroke-width="2.5"/><circle cx="420" cy="${400+40*Math.sin(f*5)}" r="14" fill="#ff3030" opacity=".6"/>
       <text x="80" y="330" fill="#ff8080" font-size="20">laser vizibil</text>`,
     rol:'Folia reflectorizantă (țintă adezivă) marchează puncte fixe pe construcții; fără reflector se măsoară direct pe suprafață.',
     car:'Folia: distanțe scurte, ideală la monitorizare. Fără reflector: puncte inaccesibile — fațade, poduri, canale, taluzuri.',
     sfat:'Fără reflector, raza laser are o pată de câțiva cm: la muchii și pe suprafețe oblice distanța poate fi greșită. Se verifică punctul vizat.'}
  ];
  const CAT = ['Stații totale', 'Trepiede', 'Ambază', 'Jaloane și bastoane', 'Reflectoare'];
  const tabs = document.getElementById('tabs'), dots = document.getElementById('dots'), sv = document.getElementById('sv'), txt = document.getElementById('txt');
  CAT.forEach((c,i) => { const b = document.createElement('button'); b.textContent = c; b.onclick = () => clk.seek(IT.findIndex(x => x.cat === i)*D + 0.01); tabs.appendChild(b); });
  IT.forEach((x,i) => { const d = document.createElement('i'); d.title = x.t; d.onclick = () => clk.seek(i*D + 0.01); dots.appendChild(d); });
  const D = 7;
  const clk = AnimUI.init({duration:IT.length*D, loop:true, phases:IT.map((x,i) => ({t:i*D, text:x.t}))});
  let last = -1;
  (function frame(){
    const t = clk.update(), k = Math.min(IT.length-1, Math.floor(t/D)), f = (t - k*D)/D, it = IT[k];
    if(k !== last){ last = k;
      txt.innerHTML = `<div class="fade"><div style="color:var(--cyan);font-weight:700;letter-spacing:1px">${CAT[it.cat].toUpperCase()}</div><div class="tt">${it.t}</div>
        <div class="lb2">La ce folosește</div><p>${it.rol}</p><div class="lb2">Caracteristici</div><p>${it.car}</p><div class="lb2">În practică</div><p>${it.sfat}</p></div>`;
      [...tabs.children].forEach((b,j) => b.classList.toggle('on', j === it.cat)); [...dots.children].forEach((d,j) => d.classList.toggle('on', j === k)); }
    sv.innerHTML = `<g opacity="${seg(f,0,0.08)*(1 - seg(f,0.95,1))}">${it.d(f)}</g>`;
    requestAnimationFrame(frame);
  })();
})();
</script>
</body></html>
